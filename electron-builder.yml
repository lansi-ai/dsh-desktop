# electron-builder 打包配置（M4-a1·Win 安装包首发）
# 产物：release/ 下 NSIS 安装包 + 便携包 + SHA256SUMS（由 scripts/make-sums.cjs 生成）
appId: deepseek-harness.desktop
productName: DSH Desktop
copyright: MIT License
directories:
  output: release
  # 打包静态资源根（图标等；当前图标直接引用 src 内资源，build/ 留空占位）
  buildResources: build
# 应用负载：编译产物 + 清单（electron-builder 自动追加生产依赖 node_modules 进 asar）
files:
  - dist/**/*
  - package.json
asar: true
# electron zip 走 npmmirror 镜像（@electron/get 缓存键与 URL 绑定，镜像必须写死在配置里
# 才能保证每次缓存命中；直连 GitHub 慢且易超时）。首次下载后缓存于
# %LOCALAPPDATA%\electron\Cache，后续离线可打包。注意：不要用 electronDist 指向
# node_modules/electron/dist —— mac CI 上它只会是宿主架构（arm64），x64 目标会打进错误内核
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
# 跳过原生模块重编译：node-pty 使用 npm install 时的预编译产物（与 dev 模式行为一致，
# 避免 node-gyp 在打包机上的工具链/缓存依赖）
npmRebuild: false
# node-pty 需解出 asar：winpty/conpty 附属 exe/dll 经真实文件路径加载，asar 内无法访问
# （mac 的 .dylib / Linux 的 .so 同理，glob 已覆盖三平台）
asarUnpack:
  - "**/node-pty/**"
# CI 发布通道：GitHub Releases（本地 dist 脚本用 --publish never 覆盖，不会误发布）
publish:
  provider: github
# dsh:// 协议声明：mac 写入 Info.plist CFBundleURLTypes（Windows 仍由运行时 setAsDefaultProtocolClient 注册）
protocols:
  - name: DSH Protocol
    schemes:
      - dsh
# macOS：dmg + zip 双 target，Apple Silicon + Intel 双架构
# icon 传 PNG 源图，electron-builder 在 mac 构建机上自动转 .icns；
# 无 Apple Developer 证书时按 ad-hoc 签名（本机可跑，外发需用户绕过 Gatekeeper）
mac:
  icon: src/desktop-shell/web/app-icon-light.png
  category: public.app-category.productivity
  # ad-hoc 签名：默认无证书时完全跳过签名，未签名 app 在 mac 上会被 Gatekeeper 杀掉
  # （M 系列更是直接无法启动）；ad-hoc 保证签名完整性，无需 Apple 开发者账号。
  # hardenedRuntime 关闭：ad-hoc + hardened 需要额外 entitlements，且 node-pty 需加载 asar 外 dylib
  identity: '-'
  hardenedRuntime: false
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
# Windows 目标：x64 安装包 + 便携包双产物
win:
  # exe/安装包图标：官方 harness logo 黑色版（浅色态官方原貌）；运行期任务栏图标
  # 由 main.ts 按 nativeTheme 动态切换黑白双版（见 scripts/make-icons.cjs）
  icon: src/desktop-shell/web/app-icon-light.png
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  artifactName: ${productName}-${version}-setup.${ext}
  # 卸载询问是否删除用户数据（M4 · 数据目录选择配套）：读取运行期写入的
  # HKCU\Software\DSH Desktop\DataDir 标记，问询后可选 RMDir。文件含中文，
  # 必须保持 UTF-8 with BOM（同 PS1 BOM 坑）。
  include: build/installer.nsh
portable:
  artifactName: ${productName}-${version}-portable.${ext}
